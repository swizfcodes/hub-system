name: Deploy — Production

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/hub-system

            echo "--- Pulling latest code"
            git pull origin main

            echo "--- Installing dependencies"
            npm install --omit=dev

            echo "--- Running migrations"
            NODE_ENV=production node scripts/migrate.js run

            echo "--- Zero-downtime reload"
            pm2 reload hub-api || pm2 start ecosystem.config.js --env production

            echo "--- Saving PM2 process list"
            pm2 save

            echo "--- Health check"
            sleep 3
            PORT=$(grep PORT /var/www/hub-system/.env | cut -d '=' -f2 | tr -d ' ')
            curl -sf http://localhost:${PORT:-3000}/health || (echo "Health check FAILED" && exit 1)

            echo "Production deploy complete ✓"